{% extends "base.html" %}

{% block content1 %}
<div class="contact-container">
  <div class="contact-info">
    <h1>Stay Connected<br>with Me</h1>
    <p class="email-text">codingumbrella@gmail.com</p>
    
    <div class="social-icons">
      <a href="https://linkedin.com" target="_blank" class="social-btn linkedin"><i class="fab fa-linkedin-in"></i></a>
      <a href="https://instagram.com" target="_blank" class="social-btn instagram"><i class="fab fa-instagram"></i></a>
      <a href="https://youtube.com" target="_blank" class="social-btn youtube"><i class="fab fa-youtube"></i></a>
    </div>
  </div>

  <div class="contact-form-card">
    <form>
      <div class="form-group">
        <label>Enter Name</label>
        <input type="text" required>
      </div>
      <div class="form-group">
        <label>Enter Email</label>
        <input type="email" required>
      </div>
      <div class="form-group">
        <label>Enter Phone No</label>
        <input type="tel">
      </div>
      <div class="form-group">
        <label>Enter Message</label>
        <textarea rows="4" required></textarea>
      </div>
      <button type="submit" class="btn-submit">Submit</button>
    </form>
  </div>
</div>
{% endblock content1 %}
